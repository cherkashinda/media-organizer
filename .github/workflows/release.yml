name: Release

# Запускается при публикации релиза на GitHub (Releases → Draft a new release → Publish).
# Собранные программы прикрепляются к этому релизу автоматически.
# Ручной запуск (Actions → Release → Run workflow) — только тестовая сборка, без релиза.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PhotoOrganizer-windows-x64.zip
          - os: macos-latest
            asset: PhotoOrganizer-macos-arm64.zip
          - os: ubuntu-latest
            asset: PhotoOrganizer-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # macOS: .app-бандл (onefile + windowed на macOS не поддерживается)
      # Windows / Linux: один исполняемый файл
      - name: Build
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then MODE=--onedir; else MODE=--onefile; fi
          pyinstaller $MODE --windowed --name PhotoOrganizer \
            --hidden-import=PIL._tkinter_finder \
            --collect-all exifread --collect-all mutagen --collect-all piexif \
            main.py

      - name: Package
        run: |
          cp README.md dist/
          cd dist
          case "$RUNNER_OS" in
            Windows) 7z a "../${{ matrix.asset }}" PhotoOrganizer.exe README.md ;;
            macOS)   ditto -c -k --keepParent PhotoOrganizer.app "../${{ matrix.asset }}" ;;
            Linux)   chmod +x PhotoOrganizer && tar czf "../${{ matrix.asset }}" PhotoOrganizer README.md ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  upload:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Исходники (zip и tar.gz) GitHub прикладывает к релизу сам
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: assets/*
